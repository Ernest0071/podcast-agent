# Tunable behaviour for podcast-agent. Credentials do NOT go here; set
# OPENROUTER_API_KEY (or ANTHROPIC_API_KEY) in .env. In the hosted deployment these values live in an
# admin-editable settings table instead (see design/DEPLOYMENT.md).

model:
  provider: openrouter    # openrouter | anthropic (both use the Anthropic Messages API)
  name: z-ai/glm-5.3-flash  # any OpenRouter model id, e.g. anthropic/claude-sonnet-5.5
  effort: high            # GLM-5.3-flash accepts low | high | max
  max_tokens: 16000
  show_thinking: true     # log reasoning in run.log
  server_side_fallback: false   # anthropic provider only
  prompt_caching: true          # anthropic provider only (OpenRouter caches automatically where supported)
  # Prices (USD per million tokens) used for the cost estimate in each report.
  input_price_per_mtok: 0.15
  output_price_per_mtok: 0.50
  cache_read_price_per_mtok: 0.03
  cache_write_price_per_mtok: 0.15
  web_search_price_per_1k: 12.0   # Exa via OpenRouter: $0.007/request + $0.001/result

agent:
  max_turns: 30
  summary_min_words: 200
  summary_max_words: 300
  takeaways_count: 5
  min_quotes: 3
  max_quotes: 6
  min_topics: 4
  max_topics: 10
  min_claims: 5
  max_claims: 12

fact_check:
  knowledge_base_path: data/knowledge_base.json
  kb_top_k: 3
  web_search: true        # server-side web search; --no-web turns it off
  web_search_max_uses: 8
  web_search_engine: auto # OpenRouter: auto | native | exa | parallel | perplexity
  web_search_max_results: 5

concurrency: 1            # episodes processed in parallel
