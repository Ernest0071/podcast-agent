[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-agent"
version = "1.0.0"
description = "Agentic podcast content pipeline: summaries, show notes and fact-checks"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
podcast-agent = "podcast_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
